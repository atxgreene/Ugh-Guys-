# Fly.io deployment for the lockstep relay.
#
# Deploy (from this server/ directory):
#   fly launch --no-deploy        # first time: creates the app; reuse THIS config
#   fly deploy                    # build + ship the image
#
# FREE-LEANING SETUP: the machine scales to ZERO when no one is connected, so an idle
# relay costs nothing, and Fly auto-starts it the instant the first player connects
# (a ~2-5s cold boot on that first connect only). An active match holds a WebSocket
# open, which keeps the machine running, so it will NOT stop mid-game. If you'd rather
# pay a couple dollars a month to avoid that first-connect delay entirely, set
# auto_stop_machines = "off" and min_machines_running = 1.
#
# App names are GLOBALLY unique on Fly. If "sotw-relay" is taken, `fly launch` will ask
# for another — whatever you pick, tell me and I'll set DEFAULT_RELAY in src/main.js to
# "wss://<app>.fly.dev".

app = "sotw-relay"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/"
