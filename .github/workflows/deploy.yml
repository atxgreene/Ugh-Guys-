name: Deploy landing page to GitHub Pages

# The playable game is deployed on Vercel (production). GitHub Pages serves the
# marketing/landing page in landing/, which links out to the Vercel build.
on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./landing
      - id: deployment
        uses: actions/deploy-pages@v4
